<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} | Woan-Shiuan Chien · NYCU</title>
    <meta name="author" content="Woan-Shiuan Chien" />
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Woan-Shiuan Chien" />
    <meta property="og:title" content="{{title}} | Woan-Shiuan Chien" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:image" content="https://woanshiuanchien.github.io/brand/og-sharing.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FAF8F4" />
    <link rel="icon" href="{{root}}favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" type="image/svg+xml" href="{{root}}brand/favicon.svg" />
    <link rel="apple-touch-icon" href="{{root}}brand/touch-icon.png" />
    <link rel="stylesheet" href="{{root}}css/brand-tokens.css" />
    <link rel="stylesheet" href="{{root}}css/fonts.css" />
    <link rel="stylesheet" href="{{root}}css/site.css" />
    <link rel="stylesheet" href="{{root}}css/portfolio.css" />
    <link rel="stylesheet" href="{{root}}css/academic-icons.css" />
{{gallery_style}}
    <script defer src="{{root}}js/site.js"></script>
    {{page_script}}
  </head>
  <body data-page="{{key}}">
    <a class="skip" href="#main">Skip to content</a>
    <div class="portfolio" id="top">
      <header class="mobile-bar">
        <a class="mobile-brand" href="{{root}}index.html"><img src="{{root}}brand/signature.svg" width="35" height="35" alt="">Woan-Shiuan Chien</a>
        <button class="drawer-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="identity-rail" hidden>{{icon_mobile_menu}}</button>
      </header>
      {{sidebar}}
      <button class="drawer-backdrop" type="button" aria-label="Close navigation" tabindex="-1" hidden></button>
      <div class="reading-pane"><main id="main" tabindex="-1">{{body}}</main>{{footer}}</div>
      <button type="button" class="back-to-top" aria-label="Back to top" title="Back to top" hidden>{{icon_petal_rise}}</button>
    </div>
  </body>
</html>
